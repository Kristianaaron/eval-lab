schema_version: "1.0"
id: health.basic_triage.001
name: 'Basic health triage'
description: 'Recognize when a symptom description requires urgent medical attention.'
version: 1
level: model
status: active

labels:
  domains: ['health']
  capabilities: ['instruction_following', 'uncertainty_calibration']
  modalities: ['text']
  difficulty: easy
  trajectory_stages: ['inspect', 'execute']
  failure_modes_targeted: []
  intervention: []
  atlas_labels: []

input:
  instruction_file: 'prompt.md'
  attachments: []
  workspace_fixture: null
  initial_state_hash: null

execution:
  runner: direct
  sandbox: null
  network: disabled
  timeout_seconds: 300
  max_turns: null
  max_tool_calls: null
  allowed_tools: []
  seeds: [0]

oracle:
  - type: regex
    weight: 1.0
    required: true
    config: {"pattern": "(?i)(urgent|emergency)"}
repetitions:
  default: 1
  seeds: []
