schema_version: "1.0"
id: toolcall.shell_automation.001
name: 'Filesystem task automation'
description: 'Navigate and process a file tree using shell tools.'
version: 1
level: model
status: active

labels:
  domains: ['tool_calling', 'agentic']
  capabilities: ['tool_selection', 'state_tracking', 'long_horizon_coherence']
  modalities: ['code']
  difficulty: medium
  trajectory_stages: ['inspect', 'plan', 'execute', 'verify']
  failure_modes_targeted: []
  intervention: []
  atlas_labels: []

input:
  instruction_file: 'prompt.md'
  attachments: []
  workspace_fixture: 'workspace'
  initial_state_hash: null

execution:
  runner: agent
  sandbox: null
  network: disabled
  timeout_seconds: 300
  max_turns: 10
  max_tool_calls: null
  allowed_tools: []
  seeds: [0]

oracle:
  - type: artifact
    weight: 1.0
    required: true
    config: {"path": "errors.txt", "min_size": 3}
repetitions:
  default: 1
  seeds: []
