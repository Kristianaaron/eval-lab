schema_version: "1.0"
id: toolcall.json_query_autonomy.001
name: 'Autonomous structured query'
description: 'Autonomously plan and run queries over a JSON dataset.'
version: 1
level: model
status: active

labels:
  domains: ['tool_calling', 'research']
  capabilities: ['planning', 'decomposition', 'tool_selection', 'tool_result_grounding']
  modalities: ['code', 'text']
  difficulty: hard
  trajectory_stages: ['inspect', 'plan', 'execute', 'verify']
  failure_modes_targeted: []
  intervention: []
  atlas_labels: []

input:
  instruction_file: 'prompt.md'
  attachments: []
  workspace_fixture: 'workspace'
  initial_state_hash: null

execution:
  runner: agent
  sandbox: null
  network: disabled
  timeout_seconds: 300
  max_turns: 10
  max_tool_calls: null
  allowed_tools: []
  seeds: [0]

oracle:
  - type: artifact
    weight: 1.0
    required: true
    config: {"path": "summary.json", "min_size": 10}
repetitions:
  default: 1
  seeds: []
