schema_version: "1.0"
id: coding.json_output.001
name: 'Structured JSON output'
description: 'Return a well-formed JSON object with an id and ok flag.'
version: 1
level: model
status: active

labels:
  domains: ['coding']
  capabilities: ['code_generation', 'instruction_following']
  modalities: ['code']
  difficulty: easy
  trajectory_stages: ['execute']
  failure_modes_targeted: []
  intervention: []
  atlas_labels: []

input:
  instruction_file: 'prompt.md'
  attachments: []
  workspace_fixture: null
  initial_state_hash: null

execution:
  runner: direct
  sandbox: null
  network: disabled
  timeout_seconds: 300
  max_turns: null
  max_tool_calls: null
  allowed_tools: []
  seeds: [0]

oracle:
  - type: json_schema
    weight: 1.0
    required: true
    config: {"schema": {"type": "object", "properties": {"id": {"type": "string"}, "ok": {"const": true}}, "required": ["id", "ok"]}}
repetitions:
  default: 1
  seeds: []
