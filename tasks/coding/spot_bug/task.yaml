schema_version: "1.0"
id: coding.spot_bug.001
name: 'Find logical bug'
description: 'Locate the line number of a logical bug in a snippet.'
version: 1
level: model
status: active

labels:
  domains: ['coding']
  capabilities: ['debugging', 'error_interpretation']
  modalities: ['code']
  difficulty: medium
  trajectory_stages: ['inspect', 'execute']
  failure_modes_targeted: []
  intervention: []
  atlas_labels: []

input:
  instruction_file: 'prompt.md'
  attachments: []
  workspace_fixture: null
  initial_state_hash: null

execution:
  runner: direct
  sandbox: null
  network: disabled
  timeout_seconds: 300
  max_turns: null
  max_tool_calls: null
  allowed_tools: []
  seeds: [0]

oracle:
  - type: regex
    weight: 1.0
    required: true
    config: {"pattern": "\"line\"\\s*:\\s*7"}
repetitions:
  default: 1
  seeds: []
