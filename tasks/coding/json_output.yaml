schema_version: "1.0"
id: coding.json_output.001
name: Produce JSON metadata
description: Return a JSON object with id and accept fields.
version: 1
level: model
status: active

labels:
  domains: [coding]
  capabilities: [instruction_following, self_verification]
  modalities: [text]
  difficulty: easy
  trajectory_stages: []
  failure_modes_targeted: []

input:
  instruction_file: prompt.md
  attachments: []

execution:
  runner: direct
  sandbox: null
  timeout_seconds: 60
  seeds: [0]

oracle:
  - type: json_schema
    config:
      properties: {id: {type: "string"}, ok: {type: "boolean"}}
      required: [id, ok]
    weight: 1.0
    required: true

repetitions:
  default: 1
  seeds: [0]
