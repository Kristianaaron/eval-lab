schema_version: "1.0"
id: reasoning.exists_statement.001
name: Deterministic existence check
description: Return any sentence containing the word complete.
version: 1
level: model
status: active

labels:
  domains: [general_reasoning]
  capabilities: [instruction_following]
  modalities: [text]
  difficulty: easy
  trajectory_stages: []
  failure_modes_targeted: []

input:
  instruction_file: prompt.md
  attachments: []

execution:
  runner: direct
  sandbox: null
  timeout_seconds: 60
  seeds: [0]

oracle:
  - type: regex
    config: {pattern: "complete"}
    weight: 1.0
    required: true

repetitions:
  default: 1
  seeds: [0]
