schema_version: "1.0"
id: reasoning.reverse_string.001
name: Reverse a string
description: Return the input string with characters reversed (case preserved).
version: 1
level: model
status: active

labels:
  domains: [general_reasoning]
  capabilities: [instruction_following, code_generation]
  modalities: [text]
  difficulty: easy
  trajectory_stages: []
  failure_modes_targeted: []

input:
  instruction_file: prompt.md
  attachments: []

execution:
  runner: direct
  sandbox: null
  timeout_seconds: 60
  seeds: [0]

oracle:
  - type: regex
    config: {pattern: "deterministic-reply"}
    weight: 1.0
    required: true

repetitions:
  default: 1
  seeds: [0]
