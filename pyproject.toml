[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eval-lab"
version = "0.1.0"
description = "Agent-agnostic local model and agent evaluation harness (Phase 0 scaffold)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "eval-lab contributors" }]
dependencies = [
    "pydantic>=2.7,<3",
    "PyYAML>=6.0,<7",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5,<6",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
    "types-PyYAML>=6.0",
]

[project.scripts]
eval-lab = "eval_lab.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/eval_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["eval_lab"]
mypy_path = "src"
